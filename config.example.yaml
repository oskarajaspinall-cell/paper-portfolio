# LiteLLM bridge (owner 2026-10-10; optional, started only by bin/run-bridge). Copy to config.yaml.
# Split routing: only the researcher (`--model portfolio-researcher`) is pointed at this proxy, which serves Gemini.
# The evaluator and every other agent talk directly to Anthropic with the Claude subscription login.
model_list:
  - model_name: portfolio-researcher
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
general_settings:
  # No master key (LiteLLM's exact setting name, from its start-up error). Safe only because bin/run-bridge binds
  # the proxy to 127.0.0.1 (this Mac only).
  dangerously_permit_weak_or_unset_master_key: true
